# Live validation of the NHL oracle driver against api-web.nhle.com from
# GitHub's runners: the driver self-validates each career against the
# API's own careerTotals, so a green run certifies the schema assumptions.
# Trigger: Actions tab -> oracle-preflight -> Run workflow (branch: sports),
# or via API. No secrets needed: the oracle tests use no keys.
name: oracle-preflight
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Oracle reachability (career endpoint hard, name lookup soft)
        env:
          RUN_ONLINE: "1"
        run: pytest -m online -k oracle -v
